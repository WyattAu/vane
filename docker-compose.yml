# vane + example upstream, single-command demo.
#
#   docker compose -f docker-compose.yml up
#   curl http://127.0.0.1:8080/api/hi   # → upstream via vane
#   curl http://127.0.0.1:9090/healthz  # → ok
#   curl http://127.0.0.1:9090/metrics  # → prometheus exposition

services:
  upstream:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:18082", "-text=hello-from-upstream"]
    expose:
      - "18082"
    networks:
      - vanenet

  vane:
    image: ${VANE_IMAGE:-ghcr.io/wyattau/vane:0.2.0}
    depends_on:
      - upstream
    ports:
      - "8080:8080"   # data plane
      - "9090:9090"   # admin plane (metrics / healthz)
    volumes:
      - ./deploy/vane.toml:/etc/vane/vane.toml:ro
    command: ["run", "-c", "/etc/vane/vane.toml"]
    networks:
      - vanenet
    # Sidecar SHM arenas live in /dev/shm (default 64MB is too small for
    # the default slot config); io_uring fixed buffers are page-locked.
    shm_size: "256mb"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

networks:
  vanenet: {}
