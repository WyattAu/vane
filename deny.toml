# cargo-deny configuration — WyattAu engineering standards (Tier A)
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Pulled in by wasmtime (the optional `wasm` feature) and its
    # toolchain crates: the Apache-2.0 text with the LLVM exception, which
    # is a permissive, GPL-incompatible license.
    "Apache-2.0 WITH LLVM-exception",
    # notify (the config hot-reload watcher) is CC0-1.0 — a public-domain
    # dedication, no obligations.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (Marvin attack): `rsa` is a dev-dependency of
# vane-filters, used only to generate an RS256 key so the JWT filter's
# RS256 verification path has real coverage. It is not in any shipped
# build graph. Tracked in SECURITY.md's advisory register — remove this
# entry if `rsa` ever becomes a normal dependency.
#
# RUSTSEC-2026-0391/0395/0398/0403 (zstd streaming-decompression soundness
# and data-leak edges): the fixes are zstd-safe >=8.2.0 / zstd >=0.14.3 —
# a MAJOR bump that wasmtime 48 pins away (wasmtime-internal-cache =
# zstd 0.13.3 / zstd-safe 7.3.0 exactly). The affected paths are module-
# cache streaming decompression inside the wasm host; vane's exposure is
# limited to its own trusted module cache, not adversarial network input.
# Remove these entries when wasmtime ships the zstd bump (>=49).
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
