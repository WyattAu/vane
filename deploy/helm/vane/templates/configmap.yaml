apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vane.fullname" . }}
  labels:
    app: {{ include "vane.name" . }}
data:
  vane.toml: |
    [[listeners]]
    address = "0.0.0.0:8080"
    mode = "http"

    [clusters.api]
    backends = ["127.0.0.1:9001"]

    [[routes]]
    pattern = "/*rest"
    cluster = "api"

    [admin]
    enabled = true
    address = "0.0.0.0:{{ .Values.admin.port }}"
