# vane dogfood config — hot-reload enabled: edit and save, no restart.

[[listeners]]
address = "0.0.0.0:8080"

[[listeners]]
address = "0.0.0.0:6379"
mode = "tcp"

[clusters.web]
backends = ["fileserver:80"]
health_path = "/"

[clusters.redis]
backends = ["redis:6379"]

[[routes]]
pattern = "/api/*rest"
cluster = "web"

# Cross-origin policy for the API route: preflights are answered at the
# edge (no upstream dial), actual requests get the response headers
# injected with Vary merged into the upstream's own.
[routes.cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_methods = ["GET", "POST", "OPTIONS"]
allow_headers = ["content-type"]
expose_headers = ["Server"]
max_age_secs = 600

[[routes]]
pattern = "/*rest"
cluster = "web"

[[routes]]
pattern = "/*"
cluster = "redis"

# Worker count is per-listener: `workers = 0` on a [[listeners]] entry
# means one worker per core (the default), so nothing to set here.
[access_log]
enabled = true

[rate_limit]
rps = 10000
burst = 20000
