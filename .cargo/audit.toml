# cargo-audit configuration. Read by `cargo audit` locally and by the
# `dependency audit` CI job, so an exception is recorded once and applies
# everywhere.
[advisories]
# RUSTSEC-2023-0071 (Marvin attack, medium): `rsa` is a **dev-dependency
# of vane-filters only**, used to generate an RS256 key so the JWT
# filter's RS256 verification path has real test coverage. It is not in
# any shipped build graph and vane never verifies an RSA signature with
# it at runtime — jsonwebtoken does, and that path is not reachable from
# vane's configuration. Tracked in SECURITY.md's advisory register; drop
# this line if rsa ever moves to a normal dependency.
ignore = ["RUSTSEC-2023-0071"]
