[package]
name = "vane-kernel"
description = "io_uring/mio dual-backend, thread-per-core transport engine for Vane"
# 0.7.0 (explicit: overrides the workspace version). History: 0.6.0 —
# WorkerConfig gained `buf_size`, BufferPool slots became size-flexible;
# 0.7.0 — the first SETTINGS frame declares
# SETTINGS_NO_RFC7540_PRIORITIES (RFC 9218 §2.1), values > 1 of that
# setting are a PROTOCOL_ERROR, and the h2 connection exposes the
# setting through additive `Setting` helpers.
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
vane_dbg = []
default = ["io-uring"]
io-uring = ["dep:io-uring"]
loom = ["dep:loom"]

[lib]
name = "vane_core"
path = "src/lib.rs"

[dependencies]
io-uring = { workspace = true, optional = true }
mio = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
core_affinity = { workspace = true }
bytes = { workspace = true }
slab-pool = { workspace = true }
vane-observe = { workspace = true }
loom = { workspace = true, optional = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
loom = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.layers]
tier = "L1"
