# WyattAu engineering standards — Tier A (concurrency/latency-critical)
# Reuses the shared workflow: WyattAu/engineering-standards/.github/workflows/rust-kit.yml
name: ci

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: a
    secrets: inherit

  e2e:
    name: end-to-end proxy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run proxy integration tests
        run: cargo test -p vane-proxy --test e2e -- --test-threads=1

  h2spec:
    name: h2 conformance (h2spec generic)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install h2spec
        run: |
          curl -sL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin h2spec
          h2spec version || true
      - name: Run h2spec generic suite against the sans-io engine
        env:
          H2SPEC: /usr/local/bin/h2spec
        run: cargo test -p vane-kernel --test h2spec -- --nocapture

  loom:
    name: loom model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Loom (SPSC ring)
        run: cargo test -p vane-kernel --features loom --test loom_spsc
      - name: Loom (event ring)
        run: cargo test -p vane-observe --features loom --test loom_ring

  miri:
    name: miri (pure-logic modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri (session slab + token packing)
        run: |
          cargo +nightly miri test -p vane-kernel --lib slab::
          cargo +nightly miri test -p vane-kernel --lib token::

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: no default features (mio-only core)
        run: cargo check --workspace --no-default-features
      - name: all features (h2/h3/wasm/k8s/rkyv)
        run: cargo check --workspace --all-features

  h3-quic:
    name: h3 QUIC suites (release)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # QUIC/TLS handshakes in debug are ~20x slower and make the
      # streaming suites load-flaky — the h3 gate runs in release.
      - name: h3 bridge/client/edge e2e
        run: |
          cargo test --release -p vane-proxy --test h3_bridge --test h3_client --test h3_edge

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage (serial proxy suites)
        run: |
          cargo llvm-cov --workspace --features vane-plugins/wasm,acme-pebble --lcov \
            --output-path lcov.info -- \
            --include-ignored --test-threads=2 -- --skip hot_upgrade --skip h3_ --skip h3spec
      - name: Chaos suite
        run: cargo test -p vane-proxy --test chaos -- --test-threads=1
      - name: Enforce Tier A threshold
        run: |
          cargo llvm-cov --workspace --features vane-plugins/wasm,acme-pebble --lcov \
            --output-path /dev/null --fail-under-lines 90 -- \
            --include-ignored --test-threads=2 --skip hot_upgrade --skip large_body_streams_through_edge --skip h3_ --skip h3spec
        # The streaming-family tests run as subprocess servers now
        # (2026-09-19) — the suite-sequence wedge is fixed, no skips
        # needed beyond the retired REUSEPORT-edge probe (kept: it is
        # #[ignore]d and --include-ignored would otherwise run it).
        # The shared Tier-A coverage job runs `--all-features` without
        # a skip passthrough.

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint
        run: helm lint charts/vane
      # `>` does not create parent directories, and a fresh runner has no
      # /tmp/opencode — the redirect failed and took the step with it.
      - name: Template (default + k8s-provider)
        run: |
          out="$(mktemp -d)"
          helm template vane charts/vane --show-only templates/configmap.yaml > "$out/cm-default.yaml"
          test -s "$out/cm-default.yaml"
          helm template vane charts/vane -f charts/vane/values-k8s-provider.yaml | grep -q "kind: ClusterRoleBinding"
      - name: Compose validation
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.hot-upgrade.yml config --quiet

  kind-smoke:
    name: kind smoke (chart + provider + data path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # /usr/local/bin is not writable on the runner ("Operation not
      # permitted" on chmod); $HOME/.local/bin already precedes it on PATH.
      - name: Install kind + kubectl + helm
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -sLo "$bin/kind" https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x "$bin/kind"
          curl -sLo "$bin/kubectl" https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x "$bin/kubectl"
          curl -sL https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz | tar -xz --strip-components=1 -C "$bin" linux-amd64/helm
          kind version && kubectl version --client=true && helm version --short
      - name: Create kind cluster
        run: kind create cluster --name vane-smoke --wait 120s
      - name: Run smoke
        run: scripts/kind-smoke.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # Known unfixed advisories are tracked in SECURITY.md.
      - run: cargo audit --file Cargo.lock

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # `fuzz/` is a separate workspace, so `cargo check --workspace` never
      # compiles a fuzz target. A stale literal in one surfaces only as a
      # sanitizer build error mid-job, naming the wrong thing — a RouteBuilder
      # that gained a field broke this job exactly that way. Compile them all
      # first so the failure is a compile error with a file and a line.
      - name: fuzz targets compile
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml --all-targets
      # tools/loadgen is a separate workspace too — same gap: a broken
      # bench script surfaces only when someone benches, mid-measurement.
      - name: bench tools compile
        run: cargo check --manifest-path tools/loadgen/Cargo.toml --all-targets
      # crossbeam-epoch (router) holds the snapshot until the process
      # exits, so LeakSanitizer reports it as a leak; leaks stay
      # undetected repo-wide. The route_lookup target used to rebuild the
      # router on every input, which churned (and leaked) an epoch
      # snapshot per input — that churn is gone, and the target now runs
      # 10.7M inputs in 120s with leak detection on and clean.
      - name: parser smoke (60s)
        run: cargo +nightly fuzz run parse_request -- -max_total_time=60 -max_len=8192 -detect_leaks=0
      - name: response smoke (60s)
        run: cargo +nightly fuzz run parse_response -- -max_total_time=60 -max_len=8192 -detect_leaks=0
      - name: h2 connection smoke (60s)
        run: cargo +nightly fuzz run h2_conn_server -- -max_total_time=60 -max_len=16384 -detect_leaks=0
      - name: xds decode smoke (60s)
        run: cargo +nightly fuzz run xds_decode -- -max_total_time=60 -max_len=16384 -detect_leaks=0
      - name: h1pool response smoke (60s)
        run: cargo +nightly fuzz run h1pool_response -- -max_total_time=60 -max_len=8192 -detect_leaks=0
      - name: chunked scanner smoke (60s)
        run: cargo +nightly fuzz run chunked_scanner -- -max_total_time=60 -max_len=4096 -detect_leaks=0
      # Regression seeds: every fuzz-found bug must stay found.
      # Corpus paths are resolved against the invocation directory, and
      # this job runs from the repo root — `corpus/regression` silently
      # pointed at a directory that does not exist and every target
      # exited 1 with "The required directory does not exist".
      - name: regression seeds (all targets)
        run: |
          seeds="$(ls fuzz/corpus/regression 2>/dev/null | wc -l)"
          echo "regression seeds: ${seeds}"
          test "$seeds" -gt 0
          for t in parse_request parse_response frame hpack h2_conn_server xds_decode h1pool_response chunked_scanner cert_san; do
            cargo +nightly fuzz run "$t" fuzz/corpus/regression -- -detect_leaks=0 -runs=5000
          done
      - name: h2 frame smoke (60s)
        run: cargo +nightly fuzz run frame -- -max_total_time=60 -detect_leaks=0
      - name: hpack smoke (60s)
        run: cargo +nightly fuzz run hpack -- -max_total_time=60 -detect_leaks=0
      - name: shm descriptor smoke (60s)
        run: cargo +nightly fuzz run shm_descriptors -- -max_total_time=60 -detect_leaks=0
      - name: access record smoke (60s)
        run: cargo +nightly fuzz run access_record -- -max_total_time=60 -detect_leaks=0
      - name: router smoke (60s)
        run: cargo +nightly fuzz run route_lookup -- -max_total_time=60 -detect_leaks=0
      - name: cert SAN walk smoke (60s)
        run: cargo +nightly fuzz run cert_san -- -max_total_time=60 -max_len=8192 -detect_leaks=0
  fuzz-nightly:
    name: fuzz deep (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Deeper budgets than the per-push smoke: 10 minutes per target.
      # Any artifact uploaded for triage; crashes fail the run.
      - name: deep fuzz (600s per target)
        run: |
          for t in parse_request parse_response frame hpack h2_conn_server xds_decode h1pool_response chunked_scanner cert_san route_lookup shm_descriptors access_record; do
            echo "=== $t ==="
            # cargo-fuzz already passes its own artifact prefix; an
            # explicit /tmp path just risks a missing directory.
            cargo +nightly fuzz run "$t" -- -max_total_time=600 -max_len=16384 -detect_leaks=0
          done
