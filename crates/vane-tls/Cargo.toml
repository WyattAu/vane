[package]
name = "vane-tls"
description = "rustls termination, ALPN, and SHM session-ticket cache for Vane"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Post-quantum hybrid key exchange: X25519MLKEM768 becomes the
# highest-priority kx group (aws-lc-rs provider). See install_crypto_
# provider — the ring provider stays the default build.
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]

[dependencies]
ctor = "1.0"
rustls = { workspace = true }

ring = { workspace = true }
shm-rings = { workspace = true }
zerocopy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.layers]
tier = "L1"
