[package]
name = "vane-filters"
description = "L4/L7 reverse proxy,edge gateway, micro sidecar monorepo"
# 0.6.0 (first version off the workspace train: the breaker dependency
# moved 1.0 -> 2.0 and the trip policy is explicit — rate-based over a
# volume-gated window with a 5 s open period — see
# `vane_breaker_config`).
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
throttle-kit = { workspace = true }
breaker = { workspace = true }
vane-observe = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
base64 = "0.22"
rsa = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true

[package.metadata.layers]
tier = "L2"
