# vane dogfood deployment — vane in front of real services.
# Config hot-reload is enabled: edit vane.toml and save.

services:
  vane:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "6379:6379"
    volumes:
      - ./vane.toml:/etc/vane/vane.toml:ro
      - ./html:/var/www:ro
    depends_on:
      - fileserver
    restart: unless-stopped

  fileserver:
    image: nginx:1.27-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
