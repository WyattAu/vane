[package]
name = "vane-loadgen"
version = "0.1.0"
edition = "2024"
publish = false
description = "vane's benchmark load generator: h1/h2/h3 clients, certgen, upstream"

# Own workspace: benchmark tooling stays out of the published workspace's
# dependency graph the same way `fuzz/` does. Other projects can clone
# this directory standalone and dogfood it against their own proxies.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
bytes = "1"
http = "1"
h2 = "0.4"
# ring pin mirrors the root workspace: tokio-rustls' default pulls
# rustls/aws_lc_rs, and a second provider makes CryptoProvider selection
# ambiguous at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rcgen = "0.14"

[profile.release]
# Latency percentiles are the claim; frame pointers make the client's own
# tail behavior debuggable without perturbing steady-state throughput.
debug = true

[lib]
name = "vane_loadgen"
path = "src/lib.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "h2load"
path = "src/bin/h2load.rs"

[[bin]]
name = "h3load"
path = "src/bin/h3load.rs"

[[bin]]
name = "certgen"
path = "src/bin/certgen.rs"

[[bin]]
name = "upstream"
path = "src/bin/upstream.rs"