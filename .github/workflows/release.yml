# Release: build + push the container image to ghcr.io on version
# tags. Uses the workflow-scoped GITHUB_TOKEN (packages: write) — no
# PAT, no local docker credentials. Charts and compose files pin exact
# versions, so `latest` is deliberately not published.
#
# Backfilling an already-cut tag: delete + re-push it
#   git push origin :refs/tags/vX.Y.Z && git tag -f vX.Y.Z && git push origin vX.Y.Z
# or run this workflow manually (workflow_dispatch).

name: release (ghcr image)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push ghcr.io/wyattau/vane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
