[package]
name = "vane-control"
# 0.2.2 adds envoy::decode_cla (EDS resources) required by vane-proxy.
# 0.8.0: user-authored config tables reject unknown fields
# (deny_unknown_fields on every table but the top-level document), and
# ACME challenge names accept the RFC 8555 spellings with legacy
# aliases.
version = "0.12.1"
description = "L4/L7 reverse proxy,edge gateway, micro sidecar monorepo"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["file-provider", "docker-provider"]
file-provider = []
docker-provider = []
k8s = []

[dependencies]
vane-proto = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
envstack = { workspace = true }
validkit = { workspace = true }
loop-retry = { workspace = true }
rustls-pki-types = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
# Leaf validity parsing for the renewal decision (already in the tree
# as a transitive dependency of rustls tooling).
x509-parser = "0.18"
ring = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
notify = { workspace = true }
vane-router = { workspace = true }
vane-observe = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
base64 = "0.22"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package.metadata.layers]
tier = "L2"
