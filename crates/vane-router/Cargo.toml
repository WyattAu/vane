[package]
name = "vane-router"
description = "Lock-free EBR routing trie and load balancers for Vane"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
rkyv = ["dep:rkyv"]

[dependencies]
crossbeam-epoch = { workspace = true }
serde = { workspace = true }
vane-observe = { workspace = true }
thiserror = { workspace = true }
rkyv = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
criterion = { workspace = true }
percentile-kit = "0.1"
rand = { workspace = true }

[[bench]]
name = "lookup"
harness = false

[lints]
workspace = true

[package.metadata.layers]
tier = "L1"
