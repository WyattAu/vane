# Local two-service demo: upstream + vane edge with file-provider routes.
services:
  upstream:
    image: ghcr.io/WyattAu/vane-demo-upstream:latest
    # Tiny HTTP server on :9001 returning "hello from upstream".
    ports: ["9001:9001"]

  vane:
    build: .
    depends_on: [upstream]
    ports:
      - "8080:8080"   # ingress
      - "9100:9100"   # admin (/metrics, /config)
    volumes:
      - ./deploy/vane.example.toml:/etc/vane/vane.toml:ro
      - vane-routes:/etc/vane/routes
    shm_size: "32mb"  # sidecar transport arenas live in /dev/shm
    cap_add:
      - IPC_LOCK      # io_uring registered buffers (page-locked pools)

volumes:
  vane-routes:
